  <script>
    (function () {
      try {
        const token = localStorage.getItem('paymentAuthToken');
        const paymentScreen = document.getElementById('paymentScreen');
        const loginScreen = document.getElementById('loginScreen');
        if (token) {
          if (paymentScreen) {
            paymentScreen.classList.add('active');
            paymentScreen.style.display = 'block';
          }
          if (loginScreen) {
            loginScreen.classList.remove('active');
            loginScreen.style.display = 'none';
          }
        } else {
          // Fallback to API
          (async function () {
            try {
              const response = await fetch('/apinode/companies/branding');
              const data = await response.json();
              if (data.success) {
                const paymentTitle = document.getElementById('paymentTitle');
                const paymentLogo = document.getElementById('paymentLogo');
                if (paymentTitle) paymentTitle.textContent = `Pago a ${data.data.displayName}`;
                if (paymentLogo) paymentLogo.src = data.data.logo;
              }
            } catch (error) {
              console.error('Error loading branding:', error);
              const companyLogo = localStorage.getItem('companyLogo');
              const displayName = localStorage.getItem('displayName');
              const paymentTitle = document.getElementById('paymentTitle');
              const paymentLogo = document.getElementById('paymentLogo');
              if (displayName && paymentTitle) paymentTitle.textContent = `Pago a ${displayName}`;
              if (companyLogo && paymentLogo) paymentLogo.src = companyLogo;
            }
          })();
        }
      } catch (error) {
        console.error('Error in initial payment screen check:', error);
      }
    })();
  </script>
  <script>
      function _getDeviceIdFromUrl() {
        const pathParts = window.location.pathname.split('/').filter(Boolean);
        const pIndex = pathParts.indexOf('p');
        if (pIndex !== -1 && pathParts[pIndex + 1]) {
          return decodeURIComponent(pathParts[pIndex + 1]).toUpperCase();
        }
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('device') || urlParams.get('id') || '';
      }

      (function () {
        const urlDeviceId = _getDeviceIdFromUrl();
        const deviceIdDisplay = document.getElementById('deviceDisplay');

        if (deviceIdDisplay && urlDeviceId) {
          deviceIdDisplay.textContent = urlDeviceId;
          deviceIdDisplay.style.display = 'block';
        }

        // Delay loading the main app module until after the initial screen has painted
        setTimeout(() => {
          const script = document.createElement('script');
          script.type = 'module';
          script.src = '../js/payment-app.js';
          document.body.appendChild(script);
        }, 0);
      })();
  </script>
